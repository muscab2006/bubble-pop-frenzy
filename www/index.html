<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a2e">
    <title>Bubble Pop Frenzy</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="hud" class="hidden">
        <span id="scoreDisplay">0</span>
        <div class="hud-center">
            <span id="levelDisplay">Lv.1</span>
            <span id="comboDisplay"></span>
        </div>
        <button id="btnSound" class="btn btn-secondary btn-small">Sound: ON</button>
    </div>

    <div id="menuScreen" class="overlay">
        <div class="game-logo">
            <div class="game-title">BUBBLE<br>POP</div>
            <div class="game-subtitle">FRENZY</div>
        </div>
        <div class="menu-buttons">
            <button id="btnPlay" class="btn btn-primary">Play</button>
            <button id="btnDaily" class="btn btn-accent hidden">Daily Challenge</button>
            <button id="btnContinue" class="btn btn-secondary">Continue (Lv.<span id="continueLevel">1</span>)</button>
            <button id="btnThemes" class="btn btn-secondary">Themes</button>
            <button id="btnStats" class="btn btn-secondary">Stats</button>
        </div>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <div class="result-title">Game Over</div>
        <div class="result-score" id="finalScore">0</div>
        <div class="result-sub">Best: <span id="highScore">0</span></div>
        <div class="result-buttons">
            <button id="btnRestart" class="btn btn-primary">Play Again</button>
            <button id="btnMenu" class="btn btn-secondary">Menu</button>
        </div>
    </div>

    <div id="levelCompleteScreen" class="overlay hidden">
        <div class="result-title">Level Complete!</div>
        <div class="result-score" id="levelScore">0</div>
        <div class="result-sub" id="levelTimeBonus"></div>
        <div class="result-buttons">
            <button id="btnNextLevel" class="btn btn-primary">Next Level</button>
            <button id="btnMenu" class="btn btn-secondary">Menu</button>
        </div>
    </div>

    <div id="themesScreen" class="overlay hidden">
        <div class="screen-title">Themes</div>
        <div id="themeList"></div>
        <div class="btn-bottom">
            <button id="btnBackFromThemes" class="btn btn-secondary">Back</button>
        </div>
    </div>

    <div id="statsScreen" class="overlay hidden">
        <div class="screen-title">Stats</div>
        <div id="statsContent"></div>
        <div class="btn-bottom">
            <button id="btnBackFromStats" class="btn btn-secondary">Back</button>
        </div>
    </div>

    <div class="watermark">Developed by Qeytil</div>

    <script src="js/storage.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/daily.js"></script>
    <script src="js/bubble.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/game.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => Game.init());
    </script>
</body>
</html>
