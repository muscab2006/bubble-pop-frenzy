name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        run: |
          find app/build/outputs -name "*.apk"
          cp app/build/outputs/apk/debug/app-debug.apk BubblePopFrenzy-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bubble-pop-frenzy-apk
          path: BubblePopFrenzy-debug.apk
          if-no-files-found: error

      - name: Publish to 'latest' release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build (Debug APK)
          files: BubblePopFrenzy-debug.apk
          prerelease: true
          body: |
            Native Android (Kotlin) build of **Bubble Pop Frenzy**.
            Download `BubblePopFrenzy-debug.apk` and install on your device (allow unknown sources).
            Developed by Qeytil.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
